<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access LifeLink – AI Blood Finder</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-primary">

    <div class="auth-wrapper">
        <div class="auth-card glass-card p-4 p-md-5">
            <!-- Brand Logo Header -->
            <div class="text-center mb-4">
                <a href="/" class="d-inline-flex align-items-center mb-2 text-decoration-none">
                    <i class="fa-solid fa-droplet text-danger me-2 fs-2 floating-element"></i>
                    <h3 class="fw-bold mb-0 text-primary">Life<span class="text-danger">Link</span></h3>
                </a>
                <p class="text-secondary small">Secure AI-Powered Blood Delivery Network</p>
            </div>

            <!-- Tabs selector for Login / Signup -->
            <div class="d-flex border-bottom border-secondary mb-4 gap-2">
                <button class="btn btn-link text-decoration-none w-50 pb-2 active-tab fw-bold text-danger" id="tab-login-btn" onclick="switchTab('login')">
                    <i class="fa-solid fa-lock me-1"></i> Log In
                </button>
                <button class="btn btn-link text-decoration-none w-50 pb-2 text-secondary fw-semibold" id="tab-register-btn" onclick="switchTab('register')">
                    <i class="fa-solid fa-user-plus me-1"></i> Register
                </button>
            </div>

            <!-- Success / Error Alerts -->
            <div class="alert alert-danger d-none small py-2 rounded-3" id="auth-error-alert"></div>
            <div class="alert alert-success d-none small py-2 rounded-3" id="auth-success-alert"></div>

            <!-- Role Selector for Registration/Login (Dynamic Toggle) -->
            <div class="mb-4">
                <label class="form-label text-secondary small">I AM A:</label>
                <div class="d-flex gap-2">
                    <input type="radio" class="btn-check" name="auth-role" id="role-donor" value="donor" checked onclick="toggleRoleFields()">
                    <label class="btn btn-outline-secondary w-50 py-2 border-secondary text-white rounded-3 small" for="role-donor">
                        <i class="fa-solid fa-hand-holding-droplet me-2 text-danger"></i> Blood Donor
                    </label>

                    <input type="radio" class="btn-check" name="auth-role" id="role-patient" value="patient" onclick="toggleRoleFields()">
                    <label class="btn btn-outline-secondary w-50 py-2 border-secondary text-white rounded-3 small" for="role-patient">
                        <i class="fa-solid fa-hospital-user me-2 text-info"></i> Patient / Hospital
                    </label>
                </div>
            </div>

            <!-- Main Interactive Form -->
            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <!-- Registration Specific fields (Hidden in Login Mode) -->
                <div id="register-fields" class="d-none">
                    <div class="mb-3">
                        <label class="form-label text-secondary small">FULL NAME</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-signature"></i></span>
                            <input type="text" class="form-id form-control bg-dark border-secondary text-white py-2.5 rounded-end-3" id="reg-name" placeholder="John Doe">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small">PHONE NUMBER</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-phone"></i></span>
                            <input type="tel" class="form-id form-control bg-dark border-secondary text-white py-2.5 rounded-end-3" id="reg-phone" placeholder="+1 (555) 012-3456">
                        </div>
                    </div>

                    <!-- Donor Specific Fields (Visible in Register + Role=Donor) -->
                    <div id="donor-specific-fields" class="mb-3">
                        <label class="form-label text-secondary small">BLOOD GROUP</label>
                        <select class="form-select bg-dark border-secondary text-white py-2.5 rounded-3" id="reg-blood-group">
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-" selected>O- (Universal Donor)</option>
                        </select>
                    </div>

                    <!-- Patient Specific Fields (Visible in Register + Role=Patient) -->
                    <div id="patient-specific-fields" class="d-none">
                        <div class="mb-3">
                            <label class="form-label text-secondary small">HOSPITAL NAME</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-hospital"></i></span>
                                <input type="text" class="form-control bg-dark border-secondary text-white py-2.5 rounded-end-3" id="reg-hospital" placeholder="City General Hospital">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-secondary small">MEDICAL PURPOSE / CONDITION</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-circle-info"></i></span>
                                <input type="text" class="form-control bg-dark border-secondary text-white py-2.5 rounded-end-3" id="reg-condition" placeholder="Emergency Trauma Surgery">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Shared Credentials fields -->
                <div class="mb-3">
                    <label class="form-label text-secondary small">EMAIL ADDRESS</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control bg-dark border-secondary text-white py-2.5 rounded-end-3" id="auth-email" placeholder="name@domain.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label text-secondary small">PASSWORD</label>
                        <a href="#" class="small text-secondary text-decoration-none" onclick="forgotPasswordAlert()">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-key"></i></span>
                        <input type="password" class="form-control bg-dark border-secondary text-white py-2.5 rounded-end-3" id="auth-password" placeholder="••••••••••••" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="glow-btn w-100 py-3 rounded-3" id="auth-submit-btn">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Access Portal
                </button>
            </form>
            
            <div class="text-center mt-4 text-secondary small">
                Back to <a href="/" class="text-danger text-decoration-none fw-bold">LifeLink Home</a>
            </div>
        </div>
    </div>

    <!-- Script management -->
    <script>
        let currentMode = 'login'; // 'login' or 'register'

        // Check query parameters to initialize state
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const tab = params.get('tab');
            const role = params.get('role');

            if (tab === 'register') {
                switchTab('register');
            }
            if (role === 'patient') {
                document.getElementById('role-patient').checked = true;
            } else if (role === 'donor') {
                document.getElementById('role-donor').checked = true;
            }
            toggleRoleFields();
        });

        function switchTab(mode) {
            currentMode = mode;
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');
            const registerFields = document.getElementById('register-fields');
            const submitBtn = document.getElementById('auth-submit-btn');

            // Reset error alerts
            hideAlerts();

            if (mode === 'login') {
                loginBtn.className = "btn btn-link text-decoration-none w-50 pb-2 active-tab fw-bold text-danger";
                regBtn.className = "btn btn-link text-decoration-none w-50 pb-2 text-secondary fw-semibold";
                registerFields.classList.add('d-none');
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Access Portal';
            } else {
                loginBtn.className = "btn btn-link text-decoration-none w-50 pb-2 text-secondary fw-semibold";
                regBtn.className = "btn btn-link text-decoration-none w-50 pb-2 active-tab fw-bold text-danger";
                registerFields.classList.remove('d-none');
                submitBtn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i> Create LifeLink Account';
            }
            toggleRoleFields();
        }

        function toggleRoleFields() {
            const role = document.querySelector('input[name="auth-role"]:checked').value;
            const donorSpecific = document.getElementById('donor-specific-fields');
            const patientSpecific = document.getElementById('patient-specific-fields');

            if (currentMode === 'login') {
                donorSpecific.classList.add('d-none');
                patientSpecific.classList.add('d-none');
                return;
            }

            if (role === 'donor') {
                donorSpecific.classList.remove('d-none');
                patientSpecific.classList.add('d-none');
            } else {
                donorSpecific.classList.add('d-none');
                patientSpecific.classList.remove('d-none');
            }
        }

        function hideAlerts() {
            document.getElementById('auth-error-alert').classList.add('d-none');
            document.getElementById('auth-success-alert').classList.add('d-none');
        }

        function forgotPasswordAlert() {
            alert("A temporary password reset link was dispatched to your email address (Mock Verification).");
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            hideAlerts();

            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const role = document.querySelector('input[name="auth-role"]:checked').value;
            
            const errorDiv = document.getElementById('auth-error-alert');
            const successDiv = document.getElementById('auth-success-alert');

            if (currentMode === 'login') {
                // Perform Login Request
                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(d => { throw new Error(d.message || 'Login failed!') });
                    }
                    return res.json();
                })
                .then(data => {
                    // Save Token & User metadata
                    localStorage.setItem('lifelink_token', data.token);
                    localStorage.setItem('lifelink_user', JSON.stringify(data.user));

                    successDiv.innerHTML = "Success! Accessing dashboard...";
                    successDiv.classList.remove('d-none');

                    // Route to appropriate dashboard
                    setTimeout(() => {
                        if (data.user.role === 'donor') {
                            window.location.href = '/donor';
                        } else if (data.user.role === 'patient') {
                            window.location.href = '/patient';
                        } else if (data.user.role === 'admin') {
                            window.location.href = '/admin';
                        }
                    }, 1000);
                })
                .catch(err => {
                    errorDiv.innerHTML = err.message;
                    errorDiv.classList.remove('d-none');
                });
            } else {
                // Perform Registration Request
                const name = document.getElementById('reg-name').value;
                const phone = document.getElementById('reg-phone').value;
                
                if (!name || !phone) {
                    errorDiv.innerHTML = "Name and Phone fields are required for registration!";
                    errorDiv.classList.remove('d-none');
                    return;
                }

                let regData = { email, password, role, name, phone };

                if (role === 'donor') {
                    regData.blood_group = document.getElementById('reg-blood-group').value;
                } else {
                    regData.hospital_name = document.getElementById('reg-hospital').value;
                    regData.medical_condition = document.getElementById('reg-condition').value;
                }

                fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(regData)
                })
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(d => { throw new Error(d.message || 'Registration failed!') });
                    }
                    return res.json();
                })
                .then(data => {
                    successDiv.innerHTML = data.message;
                    successDiv.classList.remove('d-none');
                    // Automatically switch to login tab
                    setTimeout(() => {
                        switchTab('login');
                    }, 1500);
                })
                .catch(err => {
                    errorDiv.innerHTML = err.message;
                    errorDiv.classList.remove('d-none');
                });
            }
        }
    </script>
</body>
</html>
