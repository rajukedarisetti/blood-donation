<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LifeLink AI</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container animate-fade-in my-5" style="max-width: 600px;">
        <!-- Brand Link -->
        <div class="text-center mb-4">
            <a class="d-inline-flex align-items-center gap-2 text-decoration-none fs-2 fw-bold text-dark" href="index.html">
                <i class="fa-solid fa-droplet text-danger fs-1"></i>
                <span style="font-family: var(--font-heading);">LifeLink</span>
            </a>
            <p class="text-secondary mt-1">AI-Powered Blood Donation Network</p>
        </div>

        <!-- Registration Card -->
        <div class="glass-card p-4 p-sm-5">
            <h3 class="fw-bold mb-4 text-center">Create Account</h3>
            
            <!-- Registration Role Tabs -->
            <ul class="nav nav-pills mb-4 nav-justified" id="regRoleTab" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active fw-bold" id="reg-donor-tab" data-bs-toggle="pill" data-bs-target="#donor-reg" type="button" role="tab" onclick="setRegRole('donor')">
                        <i class="fa-solid fa-hand-holding-heart me-1"></i>Register as Donor
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link fw-bold" id="reg-patient-tab" data-bs-toggle="pill" data-bs-target="#patient-reg" type="button" role="tab" onclick="setRegRole('patient')">
                        <i class="fa-solid fa-bed-pulse me-1"></i>Register as Patient
                    </button>
                </li>
            </ul>

            <!-- Form -->
            <form id="register-form">
                <!-- Hidden input to track role -->
                <input type="hidden" id="register-role" value="donor">
                
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="register-name" class="form-label fw-bold">Full Name</label>
                        <input type="text" class="form-control" id="register-name" placeholder="John Doe" required>
                    </div>
                    <div class="col-md-6">
                        <label for="register-phone" class="form-label fw-bold">Phone Number</label>
                        <input type="tel" class="form-control" id="register-phone" placeholder="+1-555-0199" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="register-email" class="form-label fw-bold">Email Address</label>
                        <input type="email" class="form-control" id="register-email" placeholder="name@domain.com" required>
                    </div>
                    <div class="col-md-6">
                        <label for="register-password" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" id="register-password" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Geolocation coordinates (Important for matching & map) -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-bold mb-0">Your Location Coordinates</label>
                        <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2 fs-8" id="locate-me-btn">
                            <i class="fa-solid fa-crosshairs me-1"></i>Locate Me
                        </button>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="number" step="any" class="form-control fs-7" id="register-latitude" placeholder="Latitude" value="12.9716" required>
                        </div>
                        <div class="col-6">
                            <input type="number" step="any" class="form-control fs-7" id="register-longitude" placeholder="Longitude" value="77.5946" required>
                        </div>
                    </div>
                    <div class="form-text fs-8 text-muted mt-1">
                        <i class="fa-solid fa-circle-info"></i> Used by our AI recommendation engine to match the nearest compatible patients and donors.
                    </div>
                </div>

                <!-- DYNAMIC DONOR PROFILE SECTIONS -->
                <div id="donor-specific-fields" class="mb-4 border-top pt-3">
                    <h5 class="fw-bold mb-3 text-danger"><i class="fa-solid fa-circle-chevron-right me-1"></i>Donor Info</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="register-blood-group" class="form-label fw-bold">Blood Group</label>
                            <select class="form-select" id="register-blood-group">
                                <option value="O+">O Positive (O+)</option>
                                <option value="O-">O Negative (O-)</option>
                                <option value="A+">A Positive (A+)</option>
                                <option value="A-">A Negative (A-)</option>
                                <option value="B+">B Positive (B+)</option>
                                <option value="B-">B Negative (B-)</option>
                                <option value="AB+">AB Positive (AB+)</option>
                                <option value="AB-">AB Negative (AB-)</option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex align-items-center justify-content-center">
                            <div class="form-check form-switch mt-4">
                                <input class="form-check-input" type="checkbox" id="register-available" checked>
                                <label class="form-check-label fw-bold" for="register-available">Go Online Instantly</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DYNAMIC PATIENT PROFILE SECTIONS -->
                <div id="patient-specific-fields" class="mb-4 border-top pt-3 d-none">
                    <h5 class="fw-bold mb-3 text-danger"><i class="fa-solid fa-circle-chevron-right me-1"></i>Patient/Hospital Info</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="register-hospital" class="form-label fw-bold">Primary Hospital Name</label>
                            <input type="text" class="form-control" id="register-hospital" placeholder="City General Hospital">
                        </div>
                        <div class="col-md-6">
                            <label for="register-condition" class="form-label fw-bold">Medical Condition</label>
                            <input type="text" class="form-control" id="register-condition" placeholder="e.g. Surgery Support, Leukemia">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 fw-bold mb-3">
                    <i class="fa-solid fa-user-plus me-2"></i>Create Account
                </button>

                <div class="text-center fs-7 text-secondary">
                    Already have an account? <a href="login.html" class="fw-bold text-danger">Sign in instead</a>
                </div>
            </form>
        </div>
        
        <div class="text-center mt-4">
            <a href="index.html" class="text-secondary fs-7"><i class="fa-solid fa-arrow-left me-1"></i>Back to Home</a>
        </div>
    </div>

    <!-- --- TOAST NOTIFICATIONS HOLDER --- -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Core Application Frontend JS -->
    <script src="assets/js/app.js"></script>
    
    <script>
        function setRegRole(role) {
            document.getElementById('register-role').value = role;
            
            const donorFields = document.getElementById('donor-specific-fields');
            const patientFields = document.getElementById('patient-specific-fields');
            
            if (role === 'donor') {
                donorFields.classList.remove('d-none');
                patientFields.classList.add('d-none');
            } else {
                donorFields.classList.add('d-none');
                patientFields.classList.remove('d-none');
            }
        }
        
        // Automated Geolocation API handler
        document.getElementById('locate-me-btn').addEventListener('click', () => {
            if (navigator.geolocation) {
                // Show floating warning toast
                showToast("Requesting Location", "Attempting to retrieve browser coordinates...", "info");
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('register-latitude').value = position.coords.latitude;
                        document.getElementById('register-longitude').value = position.coords.longitude;
                        showToast("Location Found!", `Coordinates updated to: ${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)}`, "success");
                    },
                    (error) => {
                        console.error("Geolocation error:", error);
                        showToast("Location Error", "Permission denied or service unavailable. Defaults maintained.", "warning");
                    }
                );
            } else {
                showToast("Not Supported", "Your browser does not support standard geolocation APIs.", "warning");
            }
        });
    </script>
</body>
</html>
